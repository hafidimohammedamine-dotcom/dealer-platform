# Yarn settings (founder-owned, pinned: .github/pins.txt). Lifecycle scripts are off for every install the agents run:
# a dependency's postinstall script would otherwise run inside the manager's job with the agents' GitHub token in the
# environment, and the network lock allows the registries it would need to send that token out. A package that cannot
# work without its build script is allowed one by one here, by a founder, after reading the script:
#   dependenciesMeta:
#     "<package>@<version>":
#       built: true
# (founder decision 1 in docs/runbooks/agent-network-lock.md; founder issue #35 for the organization move).
nodeLinker: node-modules
enableScripts: false
