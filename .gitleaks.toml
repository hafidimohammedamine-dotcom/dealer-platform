# Secret scan settings (founder-owned). Default rules, plus a rule for Claude tokens (the defaults of gitleaks 8.18 match
# neither an OAuth token sk-ant-oat01-... nor an API key sk-ant-api03-..., measured), plus AWS's documented fake example key.
[extend]
useDefault = true

[[rules]]
id = "anthropic-claude-token"
description = "Anthropic / Claude token or API key (sk-ant-<kind><nn>-...)"
regex = '''sk-ant-[a-z]+[0-9]{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[allowlist]
description = "AWS's documented fake example key (appears in vendor docs). Matched against the detected secret only, exact."
regexTarget = "secret"
regexes = ['''^AKIAIOSFODNN7EXAMPLE$''']
