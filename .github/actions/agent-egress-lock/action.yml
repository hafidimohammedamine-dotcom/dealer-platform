# Founder-owned. Every agent job runs this right after checkout, before anything else:
#  1. installs the pinned Claude Code release (the claude-code-action step then uses it instead of downloading),
#  2. allows outbound network only to the domains in allow-domains.txt (local DNS allow-list + firewall),
#  3. removes sudo and Docker for the rest of the job, so nothing later can undo 2,
#  4. proves it: an allowed host works, a blocked host, a raw IP, other DNS servers, IPv6 and sudo all fail.
# How it works and what it does not cover: docs/runbooks/ci-guards.md, "Agent network lock".
name: Agent egress lock
description: Pre-install Claude Code, then block outbound network except an allow-list, and drop sudo/Docker.
inputs:
  extra-domains:
    description: Space-separated extra domains for this job (founder-reviewed; plain domain names only).
    required: false
    default: ""
outputs:
  claude-path:
    description: Absolute path of the pre-installed Claude Code executable.
    value: ${{ steps.lock.outputs.claude-path }}
runs:
  using: composite
  steps:
    - id: lock
      shell: bash
      env:
        CLAUDE_CODE_VERSION: "2.1.295"
        EXTRA_DOMAINS: ${{ inputs.extra-domains }}
      run: bash "$GITHUB_ACTION_PATH/lock.sh"
