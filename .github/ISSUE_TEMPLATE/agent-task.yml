name: Agent task
description: A piece of work for one agent. Small enough to finish in one pull request.
labels: ["status:todo"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist when this is done? One or two sentences.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      description: Also add the matching agent:* label.
      options:
        - builder-intake
        - builder-ai
        - builder-crm
        - builder-inventory
        - builder-finance
        - tester
        - designer
        - devops
        - docs
        - founder
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checklist the reviewers can verify.
      placeholder: |
        - [ ] Parses the 5 sample Cars.com leads in fixtures/ into the Lead contract
        - [ ] Duplicate lead within 24h becomes a new touch, not a new lead
        - [ ] Tests for bad XML and missing phone
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must be closed first, e.g. "#1, #3". Leave empty if none.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Contracts to use, links, examples. Never paste real customer data or keys.
