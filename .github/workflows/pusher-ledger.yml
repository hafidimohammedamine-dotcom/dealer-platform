# Records who pushed every commit of a pull request (founder-owned file). GitHub keeps no durable "pusher" per commit and a
# commit's author can be forged, so this job writes its own record from the event's sender (trusted): one `guards/pusher`
# commit status per commit, signed with the GUARDS_LEDGER_KEY secret (scripts/check-pushers.sh). No concurrency group: every
# push gets its own run, nothing is dropped or cancelled. Only the base branch's script runs; the PR's files are data.
# guards.yml reads the ledger back and refuses founder-only changes unless every commit was pushed by a founder.
name: Pusher ledger
run-name: "Pusher ledger PR #${{ github.event.pull_request.number }} ${{ github.event.action }} by user ID ${{ github.event.sender.id }}"
on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: read
  statuses: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the base branch (scripts)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the pushed commits as this event's sender
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GUARDS_LEDGER_KEY: ${{ secrets.GUARDS_LEDGER_KEY }}
          SENDER_ID: ${{ github.event.sender.id }}
          ACTION: ${{ github.event.action }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # The commits of this event only: on synchronize before..after (the branch's new tip after a force push counts as
          # all new, credited to the force-pusher); on opened base..head. Shas come from the event, never from a later fetch.
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: bad head sha"; exit 1; }
          git fetch -q origin "$HEAD_SHA"
          if [ "$ACTION" = synchronize ]; then
            [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: bad after sha"; exit 1; }
            [ "$AFTER" = "$HEAD_SHA" ] || { echo "ERROR: the event's after sha ($AFTER) is not the PR head ($HEAD_SHA)"; exit 1; }
            from="$BEFORE"
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch -q origin "$BEFORE" 2>/dev/null || from="origin/$BASE_REF"
          else
            from="origin/$BASE_REF"
          fi
          bash scripts/check-pushers.sh record "$from" "$HEAD_SHA" "$SENDER_ID"
