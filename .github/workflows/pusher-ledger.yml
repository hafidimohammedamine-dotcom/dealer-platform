# Records who pushed every commit on every branch but main (founder-owned file). GitHub keeps no durable "pusher" per
# commit and a commit's author can be forged, so this job writes its own record from the push event's sender (trusted): one
# `guards/pusher` commit status per commit, signed with the GUARDS_LEDGER_KEY secret (scripts/check-pushers.sh). It runs on
# the push itself, so a commit pushed before a pull request exists is recorded too; opening a PR records nothing. No
# concurrency group: every push gets its own run. The workflow file comes from the pushed branch (the agents' token cannot
# change workflow files); the scripts come from the default branch, pinned. guards.yml reads the ledger back and refuses
# founder-only changes unless every commit was pushed by a founder.
name: Pusher ledger
run-name: "Pusher ledger ${{ github.ref_name }} by user ID ${{ github.event.sender.id }}"
on:
  push:
    branches-ignore: [main]   # every branch a pull request can come from; main has its own guard
permissions:
  contents: read
  statuses: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch (scripts), never the pushed branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: The repository files this job runs are the reviewed ones (pinned here, outside any push's reach)
        env:
          PINS_SHA256: "38e8dd003e3c3741bf158085f46a5ae599d3075bc56ed27c85b03a2e3b66a348"
        run: |
          echo "$PINS_SHA256  .github/pins.txt" | sha256sum --check --strict --quiet
          sha256sum --check --strict --quiet .github/pins.txt
      - name: Record the pushed commits as this push's sender
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GUARDS_LEDGER_KEY: ${{ secrets.GUARDS_LEDGER_KEY }}
          SENDER_ID: ${{ github.event.sender.id }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Exactly this push's commits, before..after from the event (never a later fetch). A new branch or a force push
          # (before missing or not an ancestor) credits every unrecorded commit since the default branch to this sender:
          # whoever rewrote the branch answers for what is on it. A deleted branch records nothing.
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: bad after sha"; exit 1; }
          [ "$AFTER" != 0000000000000000000000000000000000000000 ] || { echo "branch deleted; nothing to record"; exit 0; }
          git fetch -q origin "$AFTER"
          from="origin/$DEFAULT_BRANCH"
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            { git cat-file -e "$BEFORE^{commit}" 2>/dev/null || git fetch -q origin "$BEFORE" 2>/dev/null; } \
              && git merge-base --is-ancestor "$BEFORE" "$AFTER" && from="$BEFORE" || true
          fi
          bash scripts/check-pushers.sh record "$from" "$AFTER" "$SENDER_ID"
