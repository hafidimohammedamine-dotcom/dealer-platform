# Founders can mention @claude in an issue comment to ask a question about the code. Not on PRs: without a prompt the action
# checks out the PR's code itself, and nested CLAUDE.md files from the PR would load (the review job covers PRs).
# Read-only answers: Claude can read the repo and the thread and reply in the thread; it cannot change code.
# For code changes, founders open an issue for the agents or work in their own session. Founder-owned file.
name: Claude on mention
on:
  issue_comment:
    types: [created]

jobs:
  claude:
    # Only comments written by a founder (numeric ID from .github/accounts.txt; logins can be re-registered) start a run.
    if: contains(github.event.comment.body, '@claude') && !github.event.issue.pull_request && github.event.comment.user.id == 238822878
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"   # tool subprocesses do not see the Claude token (needs the lock's bubblewrap)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write          # claude-code-action signs in with GitHub OIDC for its comment token in this mode
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}   # never the PR's code
          fetch-depth: 1
          persist-credentials: false
      - name: The repository files this job runs are the reviewed ones (pinned here, outside any push's reach)
        env:
          PINS_SHA256: "d3e660741824ef19de6735aae5819ef5bf7367384041b4bc6d241547401e4b1a"
        run: |
          echo "$PINS_SHA256  .github/pins.txt" | sha256sum --check --strict --quiet
          sha256sum --check --strict --quiet .github/pins.txt
      - id: lock
        # Founder-owned: pre-installs Claude Code, then allows outbound network only to an allow-list and removes sudo/Docker.
        uses: ./.github/actions/agent-egress-lock
      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_BUILD }}
          path_to_claude_code_executable: ${{ steps.lock.outputs.claude-path }}
          path_to_bun_executable: ${{ steps.lock.outputs.bun-path }}
          claude_args: |
            --model sonnet
            --max-turns 30
            --allowedTools "Read,Grep,Glob,TodoWrite,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --disallowedTools "Skill(payload),WebFetch,WebSearch,Write,Edit,NotebookEdit,Read(//proc/**),Read(//sys/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//etc/**)"
