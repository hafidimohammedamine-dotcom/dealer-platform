# Founders' daily report at about 7am Ohio time (11:00 UTC in summer, 12:00 UTC in winter - adjust).
name: Agent - Daily report
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # agents must finish before the job ends
      GH_TOKEN: ${{ github.token }}   # job token: comment/issues in this repo only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_REVIEW }}
          github_token: ${{ github.token }}
          prompt: "/daily-report"
          claude_args: |
            --model haiku
            --max-turns 40
            --allowedTools "Read,Grep,Glob,TodoWrite,Skill,Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh run list:*),Bash(date:*)"
            --disallowedTools "WebFetch,WebSearch,Write,Edit,NotebookEdit"
          # Allow-list: the report only reads issues/PRs/runs and posts one comment. One command per Bash call.
