# Only founders may push to main (they merge pull requests). Any other push is reverted, the agents are stopped and a
# security issue is opened: scripts/check-main-push.sh. Founder-owned file. The agents' token has no `workflow` scope, so it
# cannot change this file; pushes made here with the workflow's token start no workflow (no loop).
# The push itself could have changed the script, its library or the accounts list, so this file pins all three by sha256:
# a push that changes any of them (a founder's, in a reviewed PR) also updates the hashes here. A mismatch is treated like a
# non-founder push would be: the job fails loudly and the founders look.
name: Main guard
run-name: "Main guard @ ${{ github.sha }} by user ID ${{ github.event.sender.id }}"
on:
  push:
    branches: [main]
permissions:
  contents: write   # revert commits on main
  actions: write    # disable the manager workflow after a bad push
  issues: write     # the security issue
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true   # the revert push uses the job token
      - id: pins
        name: The guard's own inputs are the reviewed ones (pinned here, outside the pushed files' reach)
        run: |
          sha256sum --check --strict <<'EOF'
          725451b00a9ae13836d93445803bc84ffaed527b0a4ba63e6e8222dcfbd4549b  scripts/check-main-push.sh
          e1d14adbbb23446f85ca23ed74c99ec5d6c3bb91b1fdcbc0f653ce3611953c9c  scripts/check-accounts-lib.sh
          c8de29b2df92ef4b1bf99604e07dbe04da582922c7a06a9ffcbe988f7a259bb5  .github/accounts.txt
          EOF
      - name: The pusher must be a founder; otherwise revert, stop the agents, open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHER_ID: ${{ github.event.sender.id }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: bash scripts/check-main-push.sh "$PUSHER_ID" "$BEFORE" "$AFTER" .github/accounts.txt
      - name: If the pins did not match, stop the agents and alert from this file alone (no repo script involved)
        if: failure() && steps.pins.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUSHER_ID: ${{ github.event.sender.id }}
          AFTER: ${{ github.event.after }}
        run: |
          gh workflow disable agent-manager.yml || true
          gh issue create --title "SECURITY: push to main changed the main guard's inputs (user ID $PUSHER_ID)" \
            --label area:security --label blocked --label priority:1 \
            --body "A push to main ($AFTER by user ID $PUSHER_ID) changed scripts/check-main-push.sh, scripts/check-accounts-lib.sh or .github/accounts.txt without updating the pins in .github/workflows/main-guard.yml. The manager workflow is disabled. Founders: check that push, revert it if it was not yours, update the pins in a founder PR, re-enable the manager." || true
          exit 1
