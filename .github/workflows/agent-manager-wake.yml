# Starts a manager shift right away when something needs the agents, instead of waiting for the hourly schedule
# (founder-owned). No Claude here: it only runs `gh workflow run agent-manager.yml` with this job's own token.
#   - CI failed on main (a merge broke something);
#   - a founder opened an issue, or put an agent:* label on one (new task);
#   - a founder commented REQUEST: or BLOCKED on an issue or PR.
# A failed review of an agent PR starts a shift from review.yml. Agents' own comments never start one (no loops), and the
# manager's concurrency group runs one shift at a time (a newer start waits for the running shift).
name: Agent - Manager wake-up
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  actions: write

jobs:
  wake:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'issues' && github.event.sender.login == 'hafidimohammedamine-dotcom' &&
       (github.event.action == 'opened' || startsWith(github.event.label.name, 'agent:'))) ||
      (github.event_name == 'issue_comment' && github.event.comment.user.login == 'hafidimohammedamine-dotcom' &&
       (contains(github.event.comment.body, 'REQUEST:') || contains(github.event.comment.body, 'BLOCKED')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start a manager shift
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WHY: ${{ github.event_name }}
        run: |
          set -euo pipefail
          gh workflow run agent-manager.yml --repo "$REPO" --ref main
          echo "Manager shift started ($WHY)"
