# Whole-codebase audit every Sunday morning, when nobody is merging.
name: Agent - Weekly audit
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_BUILD }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          prompt: "/weekly-audit"
          claude_args: |
            --model opus
            --max-turns 150
            --permission-mode bypassPermissions
          # Throwaway runner; checkout is read-only. Reviewers never edit code (rule in their instructions).
