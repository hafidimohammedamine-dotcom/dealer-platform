# Whole-codebase audit every Sunday morning, when nobody is merging.
name: Agent - Weekly audit
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Claude reads with a read-only token; the `post` job below (no Claude) holds the write scope and posts the answer.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # agents must finish before the job ends
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"   # tool subprocesses do not see the Claude token (needs the lock's bubblewrap)
      GH_TOKEN: ${{ github.token }}   # read-only job token
    outputs:
      answer: ${{ steps.answer.outputs.answer }}
      has_result: ${{ steps.answer.outputs.has_result }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main   # always the default branch
          fetch-depth: 0
          persist-credentials: false
      - id: lock
        # Founder-owned: pre-installs Claude Code, then allows outbound network only to an allow-list and removes sudo/Docker.
        uses: ./.github/actions/agent-egress-lock
      - run: corepack enable
      - name: Write the repo history as plain files for the auditors (they read these instead of running git)
        run: |
          mkdir -p /tmp/audit-meta
          git log --stat -n 300 > /tmp/audit-meta/log.txt
          git ls-files > /tmp/audit-meta/files.txt
      - id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_BUILD }}
          path_to_claude_code_executable: ${{ steps.lock.outputs.claude-path }}
          path_to_bun_executable: ${{ steps.lock.outputs.bun-path }}
          github_token: ${{ github.token }}
          prompt: "/weekly-audit"
          claude_args: |
            --model opus
            --max-turns 150
            --add-dir /tmp/audit-meta
            --allowedTools "Agent,Task,Read,Grep,Glob,TodoWrite,Skill,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh run list:*),Bash(yarn npm audit:*),Bash(yarn npm info:*),Bash(yarn why:*)"
            --disallowedTools "Skill(payload),WebFetch,WebSearch,Write,Edit,NotebookEdit,Read(//proc/**),Read(//sys/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//etc/**)"
          # Allow-list: read-only. The audit is the final answer; the next step scans and posts it. The manager opens issues from it.
      - name: Show blocked tool calls (names and commands only)
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[]? | select(.type == "result")] | last | (.permission_denials // [])[]
                 | "BLOCKED " + .tool_name + ": " + ((.tool_input.command // .tool_input.file_path // .tool_input.url // "") | tostring | .[0:300])' \
            "$EXEC_FILE" || true
      - name: Hand the answer (text only, at most 60000 characters) to the post job
        id: answer
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            echo "has_result=true" >> "$GITHUB_OUTPUT"
            d="ANSWER_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            { echo "answer<<$d"; jq -r '[.[]? | select(.type == "result")] | last | .result // empty' "$EXEC_FILE" | head -c 60000; echo; echo "$d"; } >> "$GITHUB_OUTPUT"
          else
            echo "has_result=false" >> "$GITHUB_OUTPUT"
          fi
  post:
    # The only job with a write scope; runs no Claude and reads only the answer (data) and main's post script.
    needs: audit
    if: always() && needs.audit.outputs.has_result == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      - name: Post the report (secret-scanned) to the "Daily reports" issue
        env:
          ANSWER: ${{ needs.audit.outputs.answer }}
        run: |
          set -euo pipefail
          jq -n --arg r "$ANSWER" '[{type: "result", result: $r}]' > /tmp/answer.json
          n=$(gh issue list --state open --search '"Daily reports" in:title' --json number,title --jq '[.[] | select(.title == "Daily reports")][0].number // empty')
          [ -n "$n" ] || n=$(gh issue create --title "Daily reports" --body "Daily founder reports and weekly audits." | sed 's#.*/##')
          bash scripts/check-review-post.sh issue "$n" /tmp/answer.json
