# Review team, base-defined: pull_request_target always runs THIS file, CLAUDE.md, .claude/ and the review skill
# from the base branch. The PR is fetched as data into /tmp/pr (outside the project folder, rule files removed) and
# is never built or run here - CI (ci.yml) runs the tests, and reviewers read its results.
# Uses Founder 2's Claude subscription. Founder-owned file.
name: Agent - Review team (base-defined)
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: agent-review-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Job token only (no founder token): read code, comment and label in this repo. It cannot push, merge or start
    # other workflows. The merge decision stays with a founder.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      actions: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the base branch (rules, agents, skills)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
      - name: Fetch the PR as data into /tmp/pr
        run: |
          set -euo pipefail
          git fetch -q origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          git worktree add -q --detach /tmp/pr refs/remotes/pr/head
          # Rule files inside the PR are data, not instructions: remove them from the working copy
          # (they still show up in 'git diff', so reviewers can review them).
          find /tmp/pr -path /tmp/pr/.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .mcp.json \) -type f -print0 | xargs -0 -r rm -f
          find /tmp/pr -path /tmp/pr/.git -prune -o -type d -name .claude -print0 | xargs -0 -r rm -rf
          git -C /tmp/pr log -1 --format='PR head: %H'
          # Then drop this job's git credentials: nothing below needs to fetch or push.
          git config --local --unset-all http.https://github.com/.extraheader || true
      - name: Wait for CI and guards on the PR head (max 30 min)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            states=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name=="checks" or .name=="guards") | .name+"="+.status] | join(" ")')
            echo "$states"
            case "$states" in *checks=completed*) case "$states" in *guards=completed*) exit 0;; esac;; esac
            sleep 30
          done
          echo "CI or guards did not finish in 30 minutes; reviewers will report them as pending."
      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_REVIEW }}
          github_token: ${{ github.token }}
          prompt: "/review-pr ${{ github.event.pull_request.number }}"
          claude_args: |
            --model sonnet
            --max-turns 120
            --add-dir /tmp/pr
            --allowedTools "Agent,Task,Read,Grep,Glob,TodoWrite,Skill,Bash(git -C /tmp/pr diff:*),Bash(git -C /tmp/pr log:*),Bash(git -C /tmp/pr show:*),Bash(git -C /tmp/pr ls-files:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh issue view:*)"
            --disallowedTools "WebFetch,WebSearch,Write,Edit,NotebookEdit"
