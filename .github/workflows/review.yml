# Review team, base-defined: pull_request_target always runs THIS file, CLAUDE.md, .claude/ and the review skill from
# the base branch. The PR is fetched as data into /tmp/pr (outside the project, rule files removed) and never built or
# run - CI runs the tests. Claude only reads and answers with a read-only token; a second job with the write scopes scans
# the answer for secrets, posts it and sets labels. Uses Founder 2's Claude subscription. Founder-owned file.
name: Agent - Review team
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Claude reads untrusted PR data with a read-only token; posting and labels happen in the `post` job below, which has
    # the write scopes and runs no Claude.
    # Only PRs from this repository: the repo is public, and a fork's PR must never start a Claude run (it would spend
    # the founders' Claude usage on a stranger's PR). Agents and founders push branches here, never from forks.
    if: >-
      (github.event.pull_request.draft == false) && github.run_attempt == '1' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      actions: read   # the main-head check reads the main guard's runs
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"   # tool subprocesses do not see the Claude token (needs the lock's bubblewrap)
      GH_TOKEN: ${{ github.token }}   # gh for the reviewers (read-only commands, read-only token)
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
    outputs:
      answer: ${{ steps.answer.outputs.answer }}
      has_result: ${{ steps.answer.outputs.has_result }}
    steps:
      - name: Check out the base branch (rules, agents, skills)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: The repository files this job runs are the reviewed ones (pinned here, outside any push's reach)
        env:
          PINS_SHA256: "8b0ccaaa68c360bef4aae9ebaceb6a7477aead5625a546b836d88baec9bccd82"
        run: |
          echo "$PINS_SHA256  .github/pins.txt" | sha256sum --check --strict --quiet
          sha256sum --check --strict --quiet .github/pins.txt
          bash scripts/check-pins.sh verify
      - name: The default branch's head passed the main guard (no unchecked push runs next to a Claude token)
        run: bash scripts/check-main-head.sh
      - id: lock
        # Founder-owned: pre-installs Claude Code, then allows outbound network only to an allow-list and removes sudo/Docker.
        uses: ./.github/actions/agent-egress-lock
      - name: Fetch the PR as data into /tmp/pr
        env:
          GIT_TOKEN: ${{ github.token }}
        run: bash scripts/check-review-prepare.sh "$PR_NUMBER" /tmp/pr "origin/$BASE_REF" origin "$HEAD_SHA"
      - name: Wait for CI and guards on the PR head (max 30 min)
        id: status
        run: bash scripts/check-pr-ci-status.sh "$PR_NUMBER" "$HEAD_SHA" 1800 30
      - name: Review (read-only)
        id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          # the action's post-session step "Post buffered inline comments" (it holds the GitHub token after Claude ran) is off
          classify_inline_comments: "false"
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_REVIEW_V2 }}
          path_to_claude_code_executable: ${{ steps.lock.outputs.claude-path }}
          path_to_bun_executable: ${{ steps.lock.outputs.bun-path }}
          github_token: ${{ github.token }}
          prompt: "/review-pr ${{ github.event.pull_request.number }} ${{ steps.status.outputs.result }}"
          claude_args: |
            --model sonnet
            --max-turns 120
            --add-dir /tmp/pr
            --add-dir /tmp/pr-meta
            --allowedTools "Agent,Task,Read(./**),Read(//tmp/pr/**),Read(//tmp/pr-meta/**),Grep,Glob,TodoWrite,Skill,Bash(gh pr view:*),Bash(gh issue view:*)"
            --disallowedTools "Skill(payload),WebFetch,WebSearch,Write,Edit,NotebookEdit,Read(//proc/**),Read(//sys/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//etc/**),Read(//dev/**),Read(//home/runner/runners/**),Read(./.git/**)"
      - name: Show blocked tool calls and hand the answer to the post job (pinned script)
        id: answer
        if: always()
        shell: /usr/bin/bash --noprofile --norc -p -eo pipefail {0}   # the one shell allowed after a Claude step (checker policy post_claude_shell): absolute, -p
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          # A step's own env wins over $GITHUB_ENV: nothing the Claude session wrote there reaches this shell, the loader
          # or the tools it runs (the checker requires every name below, policy post_claude_empty_env / post_claude_fixed_env).
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          GLOBIGNORE: ""
          CDPATH: ""
          BASH_XTRACEFD: ""
          POSIXLY_CORRECT: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          LD_DEBUG_OUTPUT: ""
          LD_PROFILE: ""
          LD_PROFILE_OUTPUT: ""
          LD_BIND_NOW: ""
          LD_BIND_NOT: ""
          LD_TRACE_LOADED_OBJECTS: ""
          LD_SHOW_AUXV: ""
          LD_WARN: ""
          LD_VERBOSE: ""
          LD_ORIGIN_PATH: ""
          LD_HWCAP_MASK: ""
          LD_ASSUME_KERNEL: ""
          LD_DYNAMIC_WEAK: ""
          LD_USE_LOAD_BIAS: ""
          LD_PREFER_MAP_32BIT_EXEC: ""
          GCONV_PATH: ""
          GLIBC_TUNABLES: ""
          MALLOC_CHECK_: ""
          MALLOC_PERTURB_: ""
          MALLOC_TOP_PAD_: ""
          MALLOC_MMAP_THRESHOLD_: ""
          MALLOC_MMAP_MAX_: ""
          MALLOC_TRIM_THRESHOLD_: ""
          MALLOC_ARENA_MAX: ""
          LOCPATH: ""
          NLSPATH: ""
          LANGUAGE: ""
          LC_ALL: ""
          LANG: ""
          TZ: ""
          TZDIR: ""
          TEXTDOMAINDIR: ""
          HOSTALIASES: ""
          RES_OPTIONS: ""
          LOCALDOMAIN: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_CONFIG_GLOBAL: ""
          GIT_CONFIG_SYSTEM: ""
          GIT_EXEC_PATH: ""
          GH_CONFIG_DIR: ""
          HOME: /nonexistent
          TMPDIR: /tmp
          PINS_SHA256: "8b0ccaaa68c360bef4aae9ebaceb6a7477aead5625a546b836d88baec9bccd82"
        run: |
          # First line (the checker requires it): entries the Claude session could have added to the GITHUB_PATH file never apply.
          export PATH=/usr/bin:/bin
          set -u
          # After a Claude step the body is an allow-list (checker): the pins checked with /usr/bin/sha256sum, then the pinned
          # hand-off under `env -i` with a fixed PATH, HOME and TMPDIR; the scan runs a fresh copy of the scanner checked
          # against the pinned hash (a wrong one fails the step).
          echo "$PINS_SHA256  .github/pins.txt" | /usr/bin/sha256sum --check --strict --quiet
          /usr/bin/sha256sum --check --strict --quiet .github/pins.txt
          /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent TMPDIR=/tmp GITLEAKS_BIN=/tmp/gitleaks /usr/bin/bash scripts/check-claude-answer.sh blocked "$EXEC_FILE"
          /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent TMPDIR=/tmp GITLEAKS_BIN=/tmp/gitleaks /usr/bin/bash scripts/check-claude-answer.sh answer "$EXEC_FILE" >> "$GITHUB_OUTPUT"
  post:
    # The only job with write scopes; runs no Claude and reads only the review job's answer (data) and main's scripts.
    needs: review
    if: always() && needs.review.result != 'skipped' && needs.review.outputs.has_result == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write    # the result comment and labels
      issues: write
      actions: write          # start a manager shift right after a failed review of an agent PR
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the base branch (the post script)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false
      - name: The repository files this job runs are the reviewed ones (pinned here, outside any push's reach)
        env:
          PINS_SHA256: "8b0ccaaa68c360bef4aae9ebaceb6a7477aead5625a546b836d88baec9bccd82"
        run: |
          echo "$PINS_SHA256  .github/pins.txt" | sha256sum --check --strict --quiet
          sha256sum --check --strict --quiet .github/pins.txt
          bash scripts/check-pins.sh verify
      - uses: ./.github/actions/install-gitleaks
      - name: Post the result (secret-scanned) and set labels
        env:
          ANSWER: ${{ needs.review.outputs.answer }}
        run: bash scripts/check-review-post.sh pr "$PR_NUMBER"
      - name: Start a fix round now (agent PRs that failed review)
        # Instead of waiting for the next hourly shift, start the manager as soon as an agent's PR fails review.
        # Only for PRs from this repo opened by the agents' own account: its numeric user ID from .github/accounts.txt
        # (an ID cannot be re-registered the way a login can).
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.id == 250452267 &&
          startsWith(github.event.pull_request.head.ref, 'agent/')
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,changes-requested,*) gh workflow run agent-manager.yml --repo "$REPO" --ref main && echo "Manager shift started for PR #$PR_NUMBER";;
            *) echo "Review passed or no result; no fix round needed";;
          esac
