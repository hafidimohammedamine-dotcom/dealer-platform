# Review team, base-defined: pull_request_target always runs THIS file, CLAUDE.md, .claude/ and the review skill from
# the base branch. The PR is fetched as data into /tmp/pr (outside the project, rule files removed) and never built or
# run - CI runs the tests. Claude only reads and answers; a fixed step below scans its answer for secrets, posts it and
# sets labels. Uses Founder 2's Claude subscription. Founder-owned file.
name: Agent - Review team
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write    # used only by the fixed "Post the result" step
      issues: write
      actions: write          # used only to start a manager shift right after a failed review of an agent PR
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"   # tool subprocesses do not see the Claude token (needs the lock's bubblewrap)
      GH_TOKEN: ${{ github.token }}   # gh for the reviewers (read-only commands)
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Check out the base branch (rules, agents, skills)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: lock
        # Founder-owned: pre-installs Claude Code, then allows outbound network only to an allow-list and removes sudo/Docker.
        uses: ./.github/actions/agent-egress-lock
      - name: Fetch the PR as data into /tmp/pr
        env:
          GIT_TOKEN: ${{ github.token }}
        run: bash scripts/check-review-prepare.sh "$PR_NUMBER" /tmp/pr "origin/$BASE_REF"
      - name: Wait for CI and guards on the PR head (max 30 min)
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "result=$(bash scripts/check-pr-ci-status.sh "$PR_NUMBER" "$HEAD_SHA" 1800 30)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/install-gitleaks
      - id: pin
        name: Pin the files the post step runs (checked again before it runs them)
        run: |
          { echo 'pins<<PINS_EOF'; sha256sum scripts/check-review-post.sh .gitleaks.toml /tmp/gitleaks; echo 'PINS_EOF'; } >> "$GITHUB_OUTPUT"
      - name: Review (read-only)
        id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_REVIEW }}
          path_to_claude_code_executable: ${{ steps.lock.outputs.claude-path }}
          github_token: ${{ github.token }}
          prompt: "/review-pr ${{ github.event.pull_request.number }} ${{ steps.status.outputs.result }}"
          claude_args: |
            --model sonnet
            --max-turns 120
            --add-dir /tmp/pr
            --add-dir /tmp/pr-meta
            --allowedTools "Agent,Task,Read,Grep,Glob,TodoWrite,Skill,Bash(gh pr view:*),Bash(gh issue view:*)"
            --disallowedTools "Skill(payload),WebFetch,WebSearch,Write,Edit,NotebookEdit,Read(//proc/**),Read(//sys/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//etc/**)"
      - name: Show blocked tool calls (names and commands only)
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[]? | select(.type == "result")] | last | (.permission_denials // [])[]
                 | "BLOCKED " + .tool_name + ": " + ((.tool_input.command // .tool_input.file_path // .tool_input.url // "") | tostring | .[0:300])' \
            "$EXEC_FILE" || true
      - name: Post the result (secret-scanned) and set labels
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          PINS: ${{ steps.pin.outputs.pins }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PINS" | sha256sum --check --strict --quiet
          bash scripts/check-review-post.sh pr "$PR_NUMBER" "$EXEC_FILE"
      - name: Start a fix round now (agent PRs that failed review)
        # Instead of waiting for the next hourly shift, start the manager as soon as an agent's PR fails review.
        # Only for PRs from this repo opened by the agents' own account (repository variable AGENT_GH_LOGIN, set by a founder
        # once that account exists). Until then this step never runs and agent PRs wait for the hourly shift.
        if: >-
          always() && vars.AGENT_GH_LOGIN != '' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == vars.AGENT_GH_LOGIN &&
          startsWith(github.event.pull_request.head.ref, 'agent/')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          case ",$labels," in
            *,changes-requested,*) gh workflow run agent-manager.yml --repo "$REPO" --ref main && echo "Manager shift started for PR #$PR_NUMBER";;
            *) echo "Review passed or no result; no fix round needed";;
          esac
