# Manager shift every hour (max pace, set by the founders). Uses Founder 1's Claude subscription.
name: Agent - Manager shift
on:
  schedule:
    - cron: "15 * * * *"        # every hour at :15 (UTC) - max pace; concurrency below lets a long shift finish first
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus for this shift (e.g. 'only finance issues')"
        required: false
        default: ""

concurrency:
  group: agent-manager        # only one manager shift at a time
  cancel-in-progress: false

jobs:
  shift:
    # Runs: the hourly schedule; a founder's manual run; or the review job starting a fix round (no focus text allowed then,
    # since the focus text goes into the manager's prompt).
    if: >-
      github.event_name == 'schedule' ||
      github.actor == 'hafidimohammedamine-dotcom' ||
      (github.actor == 'github-actions[bot]' && github.event.inputs.focus == '')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # agents must finish before the job ends
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}   # pushes/PRs with this token trigger the review workflow
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main   # always the default branch
          fetch-depth: 0
          persist-credentials: false   # git pushes authenticate through gh (GH_TOKEN), set up below
      - id: lock
        # Founder-owned: pre-installs Claude Code, then allows outbound network only to an allow-list and removes sudo/Docker.
        uses: ./.github/actions/agent-egress-lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - name: Git identity
        run: |
          git config user.name "agent-manager"
          git config user.email "agents@users.noreply.github.com"
          gh auth setup-git
      - id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_BUILD }}
          path_to_claude_code_executable: ${{ steps.lock.outputs.claude-path }}
          # Instant fix rounds: review.yml starts this workflow as github-actions[bot] (see the job's if:).
          allowed_bots: github-actions
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          prompt: "/manager ${{ github.event.inputs.focus }}"
          claude_args: |
            --model opus
            --max-turns 200
            --permission-mode bypassPermissions
            --disallowedTools "Skill(payload),Bash(npx:*),Bash(npm:*),Bash(yarn dlx:*),Bash(yarn create:*),Bash(node -e:*),Bash(node --eval:*),Bash(node -p:*),Bash(node --print:*),Bash(curl:*),Bash(wget:*),Bash(sudo:*),Bash(env:*),Bash(printenv:*),Bash(git push --force:*),Bash(git push -f:*),Bash(gh pr merge:*),Bash(gh api -X DELETE:*),Bash(gh secret:*),Bash(gh auth:*),Read(//proc/**),Read(//sys/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//etc/**)"
          # bypassPermissions: builders must install, build and test freely; an allow-list blocked normal work
          # ('cd <worktree> && git ...', variable assignments, loops). The deny list above still applies in this mode, but it is
          # hygiene, not a boundary: `bash -c`, `python3 -c` or `yarn node -e` get around prefix denies. The main control is
          # the agent egress lock (step `lock`): outbound HTTPS only to allow-listed host names, no sudo, no Docker. It narrows
          # the routes out but is not a complete data boundary (docs/runbooks/ci-guards.md, "Agent network lock").
          # `Skill(payload)` is denied ahead of the vendored Payload skill (#22), which agents get only as a preload
          # together with its override.
      - name: Show blocked tool calls (names and commands only)
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          jq -r '[.[]? | select(.type == "result")] | last | (.permission_denials // [])[]
                 | "BLOCKED " + .tool_name + ": " + ((.tool_input.command // .tool_input.file_path // .tool_input.url // "") | tostring | .[0:300])' \
            "$EXEC_FILE" || true
