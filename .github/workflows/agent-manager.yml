# Manager shift every 3 hours (steady pace). Uses Founder 1's Claude subscription.
name: Agent - Manager shift
on:
  schedule:
    - cron: "15 */3 * * *"      # every 3 hours at :15 (UTC)
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus for this shift (e.g. 'only finance issues')"
        required: false
        default: ""

concurrency:
  group: agent-manager        # only one manager shift at a time
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # agents must finish before the job ends
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}   # pushes/PRs with this token trigger the review workflow
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_GH_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - name: Git identity
        run: |
          git config user.name "agent-manager"
          git config user.email "agents@users.noreply.github.com"
      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_BUILD }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          prompt: "/manager ${{ github.event.inputs.focus }}"
          claude_args: |
            --model opus
            --max-turns 200
            --permission-mode bypassPermissions
            --add-dir ${{ github.workspace }}/..
          # Builders run on a throwaway GitHub runner with a token limited to this repo; inputs are only
          # founders' issues. Rules in CLAUDE.md and the review team are the guardrails, not a command list.
