# Manager shift every hour (max pace, set by the founders). Uses Founder 1's Claude subscription.
name: Agent - Manager shift
on:
  schedule:
    - cron: "15 * * * *"        # every hour at :15 (UTC) - max pace; concurrency below lets a long shift finish first
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional focus for this shift (e.g. 'only finance issues')"
        required: false
        default: ""

concurrency:
  group: agent-manager        # only one manager shift at a time
  cancel-in-progress: false

jobs:
  shift:
    # Runs: the hourly schedule; a founder's manual run; or the review job starting a fix round (no focus text allowed then,
    # since the focus text goes into the manager's prompt).
    if: >-
      (github.event_name == 'schedule' ||
      github.actor_id == '238822878' ||
      (github.actor == 'github-actions[bot]' && github.event.inputs.focus == '')) &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # The job token stays read-only: the manager pushes, opens PRs and comments with the agents' own token (GH_TOKEN below),
    # whose pushes start the review and ledger workflows; pushes with the job token would start none.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # agents must finish before the job ends
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"   # tool subprocesses do not see the Claude token (needs the lock's bubblewrap)
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN_V2 }}   # pushes/PRs with this token trigger the review workflow
      YARN_ENABLE_SCRIPTS: "false"   # no dependency lifecycle script runs next to this token, whatever a PR's .yarnrc.yml says (env beats rc files)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main   # always the default branch
          fetch-depth: 0
          persist-credentials: false   # git pushes authenticate through gh (GH_TOKEN), set up below
      - name: The repository files this job runs are the reviewed ones (pinned here, outside any push's reach)
        env:
          PINS_SHA256: "b7d344a7a5b07e687327258b1b728a985b5f6a47d7496a8dad351d7eb7bd8e83"
        run: |
          echo "$PINS_SHA256  .github/pins.txt" | sha256sum --check --strict --quiet
          sha256sum --check --strict --quiet .github/pins.txt
          bash scripts/check-pins.sh verify
      - name: The default branch's head passed the main guard (no unchecked push runs next to a Claude token)
        run: bash scripts/check-main-head.sh
      - id: lock
        # Founder-owned: pre-installs Claude Code, then allows outbound network only to an allow-list and removes sudo/Docker.
        uses: ./.github/actions/agent-egress-lock
      - name: Agents must run on their own GitHub token, never a founder's
        run: bash scripts/check-agent-token.sh .github/accounts.txt
      - name: Before the shift, the agents' account did nothing outside this repository in the last 24 hours
        run: bash scripts/check-agent-events.sh .github/accounts.txt "$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
      - name: Shift setup (corepack, git identity, pushes through gh; pinned script)
        run: bash scripts/check-shift-setup.sh
      - id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          # the action's post-session step "Post buffered inline comments" (it holds the GitHub token after Claude ran) is off
          classify_inline_comments: "false"
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_BUILD_V2 }}
          path_to_claude_code_executable: ${{ steps.lock.outputs.claude-path }}
          path_to_bun_executable: ${{ steps.lock.outputs.bun-path }}
          # Instant fix rounds: review.yml starts this workflow as github-actions[bot] (see the job's if:).
          allowed_bots: github-actions
          github_token: ${{ secrets.AGENT_GH_TOKEN_V2 }}
          prompt: "/manager ${{ github.event.inputs.focus }}"
          claude_args: |
            --model opus
            --max-turns 200
            --permission-mode bypassPermissions
            --allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep,TodoWrite,Agent,Task,Skill,NotebookEdit"
            --disallowedTools "Skill(payload),Bash(npx:*),Bash(npm:*),Bash(yarn dlx:*),Bash(yarn create:*),Bash(node -e:*),Bash(node --eval:*),Bash(node -p:*),Bash(node --print:*),Bash(curl:*),Bash(wget:*),Bash(sudo:*),Bash(env:*),Bash(printenv:*),Bash(git push --force:*),Bash(git push -f:*),Bash(gh pr merge:*),Bash(gh api -X DELETE:*),Bash(gh secret:*),Bash(gh auth:*),Bash(gh api:*),Bash(gh gist:*),Bash(gh repo:*),Bash(gh workflow:*),Bash(gh run cancel:*),Bash(gh run delete:*),Bash(yarn npm publish:*),Bash(yarn npm login:*),WebFetch,WebSearch,Read(//proc/**),Read(//sys/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//etc/**),Read(//dev/**),Read(//home/runner/runners/**),Read(./.git/**)"
          # bypassPermissions: builders must install, build and test freely; a per-command allow-list blocked normal work
          # ('cd <worktree> && git ...', variable assignments, loops). --allowedTools names whole tools, not commands: with
          # the subprocess isolation on (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB), a Bash command that needs the network (gh, git
          # fetch) is "requires approval" even in bypass mode unless Bash is allowed by name, and nobody can approve in a
          # job (2026-10-11 probe: every gh/git call of the first hosted shift was denied). The deny list still applies, but it is
          # hygiene, not a boundary: `bash -c`, `python3 -c` or `yarn node -e` get around prefix denies. The other layers: the
          # agent egress lock (step `lock`: outbound HTTPS only to allow-listed host names, no sudo, no Docker), Claude Code's
          # subprocess isolation (CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: tools never see the Claude token), and the scope of
          # GH_TOKEN: the agents' own token (classic with exactly `repo`, or fine-grained), never with `workflow` scope; the step
          # "Agents must run on their own GitHub token, never a founder's" checks that before Claude starts.
          # None of these alone is a complete boundary (docs/runbooks/agent-network-lock.md).
          # `Skill(payload)` is denied ahead of the vendored Payload skill (#22), which agents get only as a preload
          # together with its override.
      - name: Show blocked tool calls (names and commands only, pinned script)
        if: always()
        shell: /usr/bin/bash --noprofile --norc -p -eo pipefail {0}   # the one shell allowed after a Claude step (checker policy post_claude_shell): absolute, -p
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          # A step's own env wins over $GITHUB_ENV: nothing the Claude session wrote there reaches this shell, the loader
          # or the tools it runs (the checker requires every name below, policy post_claude_empty_env / post_claude_fixed_env).
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          GLOBIGNORE: ""
          CDPATH: ""
          BASH_XTRACEFD: ""
          POSIXLY_CORRECT: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          LD_DEBUG: ""
          LD_DEBUG_OUTPUT: ""
          LD_PROFILE: ""
          LD_BIND_NOW: ""
          GCONV_PATH: ""
          GLIBC_TUNABLES: ""
          MALLOC_CHECK_: ""
          MALLOC_PERTURB_: ""
          MALLOC_TOP_PAD_: ""
          MALLOC_MMAP_THRESHOLD_: ""
          MALLOC_TRIM_THRESHOLD_: ""
          MALLOC_ARENA_MAX: ""
          LOCPATH: ""
          NLSPATH: ""
          LANGUAGE: ""
          LC_ALL: ""
          LANG: ""
          TZ: ""
          TZDIR: ""
          TEXTDOMAINDIR: ""
          HOSTALIASES: ""
          RES_OPTIONS: ""
          LOCALDOMAIN: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
          NO_PROXY: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_CONFIG_GLOBAL: ""
          GIT_CONFIG_SYSTEM: ""
          GIT_EXEC_PATH: ""
          GH_CONFIG_DIR: ""
          HOME: /nonexistent
          TMPDIR: /tmp
          PINS_SHA256: "b7d344a7a5b07e687327258b1b728a985b5f6a47d7496a8dad351d7eb7bd8e83"
        run: |
          # First line (the checker requires it): entries the Claude session could have added to the GITHUB_PATH file never apply.
          export PATH=/usr/bin:/bin
          set -u
          # After a Claude step the body is an allow-list (checker): the pins checked with /usr/bin/sha256sum, then the pinned
          # hand-off under `env -i` with a fixed PATH, HOME and TMPDIR; the scan runs a fresh copy of the scanner checked
          # against the pinned hash (a wrong one fails the step).
          echo "$PINS_SHA256  .github/pins.txt" | /usr/bin/sha256sum --check --strict --quiet
          /usr/bin/sha256sum --check --strict --quiet .github/pins.txt
          /usr/bin/env -i PATH=/usr/bin:/bin HOME=/nonexistent TMPDIR=/tmp GITLEAKS_BIN=/tmp/gitleaks GITLEAKS_SHA256= /usr/bin/bash scripts/check-claude-answer.sh blocked "$EXEC_FILE"
  after:
    # A fresh job after the shift (the shift's Claude ran with bypassPermissions and could have written $GITHUB_ENV or
    # $GITHUB_PATH of its own job): the pinned scripts re-check the agents' token and the guard workflows, and that the
    # agents' account did nothing outside this repository in the last day (the token can comment anywhere).
    needs: shift
    if: always() && needs.shift.result != 'skipped' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN_V2 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: The repository files this job runs are the reviewed ones (pinned here, outside any push's reach)
        env:
          PINS_SHA256: "b7d344a7a5b07e687327258b1b728a985b5f6a47d7496a8dad351d7eb7bd8e83"
        run: |
          echo "$PINS_SHA256  .github/pins.txt" | sha256sum --check --strict --quiet
          sha256sum --check --strict --quiet .github/pins.txt
          bash scripts/check-pins.sh verify
      - name: After the shift, the agents' token is still its own, the guard workflows are active and main passed the main guard
        run: bash scripts/check-agent-token.sh .github/accounts.txt
      - name: After the shift, the agents' account did nothing outside this repository in the last 24 hours
        # A rolling day, not "since the shift started": the events feed can lag, so the check before the next shift sees
        # what this one missed.
        run: bash scripts/check-agent-events.sh .github/accounts.txt "$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
