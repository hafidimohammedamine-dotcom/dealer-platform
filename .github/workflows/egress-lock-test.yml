# Proves the agent egress lock on a real runner whenever it changes (founder-owned).
# The lock's own self-test (inside the action) fails the job if an allowed host is unreachable, or if a blocked host, a raw IP,
# an outside DNS server, IPv6, sudo or Docker still works. This job then runs the real pinned claude-code-action under the lock,
# and checks that `Skill(payload)` in --disallowedTools really blocks a skill named payload (a throwaway probe skill here).
name: Agent egress lock test
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/actions/agent-egress-lock/**"
      - ".github/workflows/egress-lock-test.yml"
permissions:
  contents: read
concurrency:
  group: egress-lock-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  lock:
    # Same-repo PRs only (forks get no secrets).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: lock
        uses: ./.github/actions/agent-egress-lock
      - name: Blocked after the lock (again, from a later step)
        run: |
          set -u
          fail=0
          if curl -sS -o /dev/null --max-time 8 https://example.com 2>/dev/null; then echo "::error::example.com reachable"; fail=1; fi
          if curl -sS -o /dev/null --max-time 8 https://storage.googleapis.com 2>/dev/null; then echo "::error::storage.googleapis.com reachable"; fail=1; fi
          if sudo -n true 2>/dev/null; then echo "::error::sudo works"; fail=1; fi
          curl -fsS -o /dev/null --max-time 20 https://registry.npmjs.org/ || { echo "::error::npm registry not reachable"; fail=1; }
          exit "$fail"
      - name: Throwaway probe skill named payload (user-level; the action restores the project .claude/ from main)
        run: |
          mkdir -p "$HOME/.claude/skills/payload"
          printf -- '---\nname: payload\ndescription: Probe skill for the deny test.\n---\nIf you can read this, reply PROBE-LOADED.\n' > "$HOME/.claude/skills/payload/SKILL.md"
      - id: claude
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_REVIEW }}
          path_to_claude_code_executable: ${{ steps.lock.outputs.claude-path }}
          github_token: ${{ github.token }}
          prompt: "Test. First call the Skill tool with skill 'payload'. Then reply with EGRESS-LOCK-OK, plus SKILL-DENIED if that call was denied."
          claude_args: |
            --model haiku
            --max-turns 4
            --allowedTools "Skill,TodoWrite"
            --disallowedTools "Skill(payload),Bash,Write,Edit,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//sys/**),Read(//home/runner/work/_temp/**),Read(//home/runner/.*/**),Read(//etc/**)"
      - name: Claude answered under the lock, and Skill(payload) was denied
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          python3 - "$EXEC_FILE" <<'EOF'
          import json, sys
          d = json.load(open(sys.argv[1]))
          r = [x for x in d if isinstance(x, dict) and x.get("type") == "result"]
          text = (r[-1].get("result") or "") if r else ""
          denials = (r[-1].get("permission_denials") or []) if r else []
          print("result:", text[:200])
          print("denials:", json.dumps(denials)[:300])
          ok = "EGRESS-LOCK-OK" in text and "PROBE-LOADED" not in text
          ok = ok and any(x.get("tool_name") == "Skill" and (x.get("tool_input") or {}).get("skill") == "payload" for x in denials)
          sys.exit(0 if ok else 1)
          EOF
