# TEMPORARY founder experiment on branch founder/egress-scratch3 only. Never merged.
name: Egress lock scratch
on:
  push:
    branches: [founder/egress-scratch3]
permissions:
  contents: read
jobs:
  completes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: lock
        uses: ./.github/actions/agent-egress-lock
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u; fail=0
          getent ahostsv4 github.com | head -1
          curl -fsS -o /dev/null --max-time 20 https://api.github.com/zen && echo "api.github.com OK" || { echo "::error::api.github.com failed"; fail=1; }
          curl -fsS -o /dev/null --max-time 20 https://registry.npmjs.org/ && echo "npm OK" || { echo "::error::npm failed"; fail=1; }
          (cd "$(mktemp -d)" && corepack yarn@4.18.1 --version) || { echo "::error::yarn failed"; fail=1; }
          { gh auth setup-git && git ls-remote origin HEAD >/dev/null; } && echo "git OK" || { echo "::error::git failed"; fail=1; }
          curl -sS -o /dev/null --max-time 8 https://x.github.com && { echo "::error::x.github.com reachable"; fail=1; } || echo "x.github.com blocked"
          curl -sS -o /dev/null --max-time 8 https://example.com && { echo "::error::example.com reachable"; fail=1; } || echo "example.com blocked"
          exit $fail
