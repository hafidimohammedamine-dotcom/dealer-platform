# TEMPORARY founder experiment on branch founder/egress-scratch3 only. Never merged.
name: Egress lock scratch
on:
  push:
    branches: [founder/egress-scratch3]
permissions:
  contents: read
jobs:
  completes:
    # No id-token: the job must finish right after its last step (the runner reports through the allowed service names).
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: lock
        uses: ./.github/actions/agent-egress-lock
      - run: |
          date -u +%T; echo "locked; now the job should complete within a minute"
          curl -sS -o /dev/null -w 'broker foreign-host: %{http_code}\n' -H 'Host: example.com' https://broker.actions.githubusercontent.com/ || true
          curl -sS -o /dev/null -w 'results-receiver foreign-host: %{http_code}\n' -H 'Host: example.com' https://results-receiver.actions.githubusercontent.com/ || true
