# TEMPORARY founder experiment on branch founder/egress-scratch3 only. Never merged.
name: Egress lock scratch
on:
  push:
    branches: [founder/egress-scratch3]
permissions:
  contents: read
jobs:
  runnerhosts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Service hosts in the runner processes' environment and config (host names only)
        run: |
          for p in $(pgrep -f 'Runner.Worker|Runner.Listener'); do
            echo "--- pid $p $(cat /proc/$p/comm)"
            sudo tr '\0' '\n' < /proc/$p/environ | grep -oE 'https?://[A-Za-z0-9.-]+' | sort -u
            sudo tr '\0' '\n' < /proc/$p/environ | grep -oE '^[A-Z_]*(URL|HOST)[A-Z_]*=' | sort -u | tr '\n' ' '; echo
          done
          d=/home/runner/actions-runner/cached/2.337.0
          echo "--- .runner"; sudo python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print({k: d[k] for k in ("ServerUrl","ServerUrlV2","IsHostedServer","useV2Flow","PoolName","WorkFolder") if k in d})' "$d/.runner"
          echo "--- worker peers"; sudo ss -tnp state established | grep -i Runner.Worker | awk '{print $4}' | sort -u
          echo "--- which hosts resolve to those peers"; for h in results-receiver.actions.githubusercontent.com run-actions-3-azure-eastus.actions.githubusercontent.com pipelinesghubeus6.actions.githubusercontent.com pipelinesghubeus9.actions.githubusercontent.com; do printf '%s ' "$h"; getent ahostsv4 "$h" | awk 'NR==1{print $1}'; done; true
