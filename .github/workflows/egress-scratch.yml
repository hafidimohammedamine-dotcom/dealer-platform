# TEMPORARY founder experiment on branch founder/egress-scratch only. Never merged.
name: Egress lock scratch
on:
  push:
    branches: [founder/egress-scratch]
permissions:
  contents: read
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: lock
        uses: ./.github/actions/agent-egress-lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: After the lock
        run: |
          set -x
          python3 -c 'import yaml; print("pyyaml", yaml.__version__)' || true
          corepack enable || true
          cd "$(mktemp -d)" && corepack yarn@4.18.1 --version || true
          getent hosts registry.yarnpkg.com || true
          curl -sS -o /dev/null -w '%{http_code}\n' https://api.anthropic.com/ || true
          curl -sS -o /dev/null -w '%{http_code}\n' --max-time 8 https://storage.googleapis.com/ || true
          sudo -n true && echo SUDO-STILL-WORKS || echo sudo-blocked
          sudo iptables -L OUTPUT -n 2>&1 | head -3 || true
          cat /etc/resolv.conf
      - name: Claude under the lock
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_TOKEN_REVIEW }}
          CLAUDE: ${{ steps.lock.outputs.claude-path }}
        run: |
          cd "$(mktemp -d)"
          "$CLAUDE" -p "Reply with EGRESS-OK, then try the WebFetch tool on https://example.com and say in one line whether it worked." \
            --model haiku --max-turns 4 --allowedTools WebFetch --output-format json < /dev/null > out.json 2> err.txt || true
          python3 -c 'import json; d=json.load(open("out.json")); print("RESULT:", d.get("result")); print("IS_ERROR:", d.get("is_error"))' || { cat out.json; cat err.txt; }
