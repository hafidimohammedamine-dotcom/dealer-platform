# TEMPORARY founder experiment on branch founder/egress-scratch2 only. Never merged.
name: Egress lock scratch
on:
  push:
    branches: [founder/egress-scratch2]
permissions:
  contents: read
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: lock
        env:
          AGENT_LOCK_DEBUG: "1"
        uses: ./.github/actions/agent-egress-lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: After the lock
        run: |
          set -x
          cd "$(mktemp -d)" && corepack yarn@4.18.1 --version || true
          git ls-remote https://github.com/hafidimohammedamine-dotcom/dealer-platform HEAD >/dev/null 2>&1 && echo git-ok || echo git-failed-auth-expected
          gh api zen 2>&1 | head -1 || true
          curl -sS -o /dev/null -w 'anthropic %{http_code}\n' https://api.anthropic.com/ || true
          sudo cat /var/log/agent-nginx.log 2>/dev/null | tail -5 || true
      - name: Claude under the lock with subprocess scrub
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_TOKEN_REVIEW }}
          CLAUDE: ${{ steps.lock.outputs.claude-path }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$(mktemp -d)"
          "$CLAUDE" -p "Run each Bash command separately and report each output in one line: (1) gh api zen  (2) env | cut -d= -f1 | grep -cE 'CLAUDE_CODE_OAUTH_TOKEN|ANTHROPIC_API_KEY'  (3) env | cut -d= -f1 | grep -c GH_TOKEN  (4) cd \$(mktemp -d) && corepack yarn@4.18.1 --version  (5) touch \$GITHUB_WORKSPACE/x && echo wrote-workspace" \
            --model haiku --max-turns 8 --allowedTools Bash --output-format json < /dev/null > out.json 2> err.txt || true
          python3 -c 'import json; d=json.load(open("out.json")); print("RESULT:", d.get("result"))' || { cat out.json; tail -20 err.txt; }
  broken:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: lock
        continue-on-error: true
        env:
          AGENT_LOCK_SELFTEST_BREAK: "1"
        uses: ./.github/actions/agent-egress-lock
      - run: echo "lock outcome=${{ steps.lock.outcome }}"; [ "${{ steps.lock.outcome }}" = failure ]
