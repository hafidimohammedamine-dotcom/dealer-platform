# Guard checks that a pull request cannot change: pull_request_target always runs THIS file and the scripts from the
# base branch. The PR's files are fetched as data only and never executed. Founder-owned file.
name: Guards
run-name: "Guards PR #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true   # the pusher ledger is written by pusher-ledger.yml (no concurrency group), not here

jobs:
  guards:
    if: github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read          # read-only token; nothing from the PR is run
      statuses: read          # reads the pusher ledger (guards/pusher commit statuses written by pusher-ledger.yml)
    env:
      BASE_REF: ${{ github.base_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # Both come from the event, not from anything the PR controls: who opened the PR, and who triggered this run.
      # Numeric IDs, not logins (a login can be renamed and re-registered).
      USER_IDS: ${{ github.event.pull_request.user.id }},${{ github.event.sender.id }}
    steps:
      - name: Check out the base branch (rules, scripts, config)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: The repository files this job runs are the reviewed ones (pinned here, outside any push's reach)
        env:
          PINS_SHA256: "22e30fe4ac8339542517b3b3175cba153e36e1b57d168261ddc706606b324338"
        run: |
          echo "$PINS_SHA256  .github/pins.txt" | sha256sum --check --strict --quiet
          sha256sum --check --strict --quiet .github/pins.txt
          bash scripts/check-pins.sh verify
      - name: Fetch the PR as data into /tmp/pr
        env:
          GIT_TOKEN: ${{ github.token }}
        run: bash scripts/check-review-prepare.sh "$PR_NUMBER" /tmp/pr "" origin "$HEAD_SHA"
      - name: Pinned Python packages for the guard scripts (hash-checked)
        run: bash scripts/check-python-deps.sh >> "$GITHUB_PATH"
      - name: Who pushed each commit (from the ledger written by pusher-ledger.yml)
        env:
          GH_TOKEN: ${{ github.token }}
          GUARDS_LEDGER_KEY: ${{ secrets.GUARDS_LEDGER_KEY }}
        run: |
          set -euo pipefail
          # The prepare step proved the fetched head is the event's; this run judges that head.
          bash scripts/check-pushers.sh verify "origin/$BASE_REF" "$HEAD_SHA" .github/accounts.txt | tee /tmp/pushers.txt
      - name: Founder-only files (PR author and every pusher must be founders)
        run: bash scripts/check-founder-files.sh "origin/$BASE_REF" refs/remotes/pr/head "$USER_IDS" .github/accounts.txt /tmp/pushers.txt
      - name: Skills match manifest and checksums
        # /tmp/pr has rule files removed, so check the PR's own .claude/ (skills and agents) from git, not from that copy.
        run: |
          set -euo pipefail
          bash scripts/check-pr-archive.sh refs/remotes/pr/head /tmp/pr-skills .claude
          bash scripts/check-skills.sh /tmp/pr-skills
      - name: Third-party skills compared with the base branch (no quiet switch to 'ours' or to another repo)
        run: bash scripts/check-skills-vs-base.sh . /tmp/pr-skills
      - name: Third-party skills equal their pinned upstream with deletions only (fresh fetch of the locked commit)
        run: bash scripts/check-skills-upstream-all.sh /tmp/pr-skills /tmp/pr-upstream
      - name: Agent workflows keep their denies and pins (base script, the PR's tree as data)
        run: |
          set -euo pipefail
          # The PR's whole tree unpacked as data (never run; /tmp/pr has the rule files removed, but the pins cover them):
          # its workflows, local actions, pins.txt and every pinned file. The accounts list comes from the base branch (a PR
          # cannot add itself). Skill denies are required for every third-party skill named in the base or the PR manifest.
          bash scripts/check-pr-archive.sh refs/remotes/pr/head /tmp/pr-wf
          bash scripts/check-workflows.sh /tmp/pr-wf --accounts .github/accounts.txt \
            --manifest .claude/skills/manifest.txt --manifest /tmp/pr-skills/.claude/skills/manifest.txt
      - uses: ./.github/actions/install-gitleaks
      - name: Secret scan of the PR's commits (base config, no ignore files, no inline allow)
        run: |
          set -euo pipefail
          mkdir -p /tmp/noignore
          /tmp/gitleaks detect --source=. --config=.gitleaks.toml --gitleaks-ignore-path=/tmp/noignore \
            --ignore-gitleaks-allow --redact --verbose --log-opts="origin/$BASE_REF..refs/remotes/pr/head"
