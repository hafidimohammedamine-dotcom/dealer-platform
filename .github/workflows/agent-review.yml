# Review team on every pull request push. Uses Founder 2's Claude subscription. Founder-owned file.
name: Agent - Review team
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true      # a new push replaces an older review of the same PR

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Reviewers use the job's own short-lived GITHUB_TOKEN (no founder token): it can read code and comment/label
    # on PRs and issues in this repo only, and cannot push, merge or start other workflows.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"   # agents must finish before the job ends
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reviewers use the base branch's rules, agents and settings
        # A PR must not be able to change the rules it is judged by. Remove every agent-instruction file the PR
        # brings (at any depth), then restore the base branch's copies. Fails if the base has no rules.
        run: |
          set -euo pipefail
          git rev-parse --verify -q "origin/$BASE_REF" >/dev/null || { echo "ERROR: origin/$BASE_REF not in checkout (needs fetch-depth: 0)"; exit 1; }
          git cat-file -e "origin/$BASE_REF:CLAUDE.md"
          git cat-file -e "origin/$BASE_REF:.claude"
          find . -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .mcp.json \) -print0 | xargs -0 rm -f
          find . -path ./.git -prune -o -type d -name .claude -print0 | xargs -0 rm -rf
          git checkout "origin/$BASE_REF" -- CLAUDE.md .claude
          for p in $(git ls-tree -r --name-only "origin/$BASE_REF" | grep -E '(^|/)(CLAUDE(\.local)?\.md|\.mcp\.json)$' || true); do
            git checkout "origin/$BASE_REF" -- "$p"
          done
          echo "Rules restored from $BASE_REF:"; git diff --stat "origin/$BASE_REF" -- CLAUDE.md .claude | tail -1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: corepack enable
      - uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b # v1.0.247
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_REVIEW }}
          github_token: ${{ github.token }}
          prompt: "/review-pr ${{ github.event.pull_request.number }}"
          claude_args: |
            --model sonnet
            --max-turns 120
            --permission-mode bypassPermissions
          # bypassPermissions: the runner is thrown away after the job and the token above can only comment and label.
          # Reviewers never edit code (their instructions); the checkout has no stored credentials, so they cannot push.
