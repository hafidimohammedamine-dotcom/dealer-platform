# Review team on every pull request push. Uses Founder 2's Claude subscription.
name: Agent - Review team
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true      # a new push replaces an older review of the same PR

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_TOKEN_REVIEW }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          prompt: "/review-pr ${{ github.event.pull_request.number }}"
          claude_args: |
            --model sonnet
            --max-turns 120
            --allowedTools "Agent,Task,Read,Glob,Grep,Write,WebFetch,WebSearch,Bash(git diff:*),Bash(git log:*),Bash(git fetch:*),Bash(gh pr:*),Bash(gh issue:*),Bash(yarn:*),Bash(npm audit:*),Bash(corepack:*),Bash(ls:*),Bash(cat:*)"
