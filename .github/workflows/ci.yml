# Normal checks on every PR and on main: tests, lint, build. No secrets here; the guards that a PR must not be able
# to change run in guards.yml (pull_request_target). Founder-owned file.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.18.4
      GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks for the config test (pinned by checksum)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Guard script tests
        run: |
          bash scripts/check-founder-files.test.sh
          bash scripts/check-skills.test.sh
          GITLEAKS=/tmp/gitleaks bash scripts/gitleaks-config.test.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
      - name: Install
        if: hashFiles('package.json') != ''
        run: corepack enable && yarn install --immutable
      - name: Lint
        if: hashFiles('package.json') != ''
        run: yarn lint
      - name: Type check
        if: hashFiles('package.json') != ''
        run: yarn typecheck
      - name: Tests
        if: hashFiles('package.json') != ''
        run: yarn test
      - name: Build
        if: hashFiles('package.json') != ''
        run: yarn build
      - name: Dependency audit
        if: hashFiles('package.json') != ''
        run: yarn npm audit --severity moderate --all --recursive
