# Normal checks on every PR. Branch protection should require this to pass.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, free CLI)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source=/repo --redact --verbose
      - name: Agents may not change founder-only files
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          bad=$(echo "$changed" | grep -E '^(CLAUDE\.md|\.claude/|scripts/check-skills|scripts/gitleaks-config|\.gitleaks\.toml|\.github/(workflows/agent-|CODEOWNERS)|packages/contracts/)' || true)
          if [ -n "$bad" ]; then echo "Agent branch changes founder-only files:"; echo "$bad"; exit 1; fi
      - name: Skills unchanged (check script from the base branch)
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && git fetch -q origin "${{ github.base_ref }}" \
             && git cat-file -e "origin/${{ github.base_ref }}:scripts/check-skills.sh" 2>/dev/null; then
            git show "origin/${{ github.base_ref }}:scripts/check-skills.sh" > /tmp/check-skills.sh
            echo "Using the base branch's check script"
          else
            cp scripts/check-skills.sh /tmp/check-skills.sh
          fi
          bash /tmp/check-skills.sh "$PWD"
      - name: Skills check tests
        run: bash scripts/check-skills.test.sh
      - name: Secret-scan allowlist test
        run: GITLEAKS="docker run --rm -v /tmp:/tmp zricethezav/gitleaks:v8.18.4" bash scripts/gitleaks-config.test.sh
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
      - name: Install
        if: hashFiles('package.json') != ''
        run: corepack enable && yarn install --immutable
      - name: Lint
        if: hashFiles('package.json') != ''
        run: yarn lint
      - name: Type check
        if: hashFiles('package.json') != ''
        run: yarn typecheck
      - name: Tests
        if: hashFiles('package.json') != ''
        run: yarn test
      - name: Dependency audit
        if: hashFiles('package.json') != ''
        run: yarn npm audit --severity moderate --all --recursive
