# Normal checks on every PR and on main: tests, lint, build. No secrets here; the guards that a PR must not be able
# to change run in guards.yml (pull_request_target). Founder-owned file.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      - name: Secret scan of all history (pushes to main)
        if: github.event_name == 'push'
        run: /tmp/gitleaks detect --source=. --config=.gitleaks.toml --redact --verbose
      - name: Guard script tests
        run: |
          bash scripts/check-founder-files.test.sh
          bash scripts/check-skills.test.sh
          bash scripts/check-skill-upstream.test.sh
          bash scripts/check-skill-deletions.test.sh
          bash scripts/check-skills-upstream-all.test.sh
          bash scripts/check-skills-vs-base.test.sh
          bash scripts/check-workflows.sh
          bash scripts/check-workflows.test.sh
          bash scripts/check-egress-lock.test.sh
          bash scripts/check-review-prepare.test.sh
          bash scripts/check-pr-ci-status.test.sh
          bash scripts/check-review-post.test.sh
          GITLEAKS=/tmp/gitleaks bash scripts/gitleaks-config.test.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
      - name: Install
        if: hashFiles('package.json') != ''
        run: corepack enable && yarn install --immutable
      - name: Lint
        if: hashFiles('package.json') != ''
        run: yarn lint
      - name: Type check
        if: hashFiles('package.json') != ''
        run: yarn typecheck
      - name: Tests
        if: hashFiles('package.json') != ''
        run: yarn test
      - name: Build
        if: hashFiles('package.json') != ''
        run: yarn build
      - name: Dependency audit
        if: hashFiles('package.json') != ''
        run: yarn npm audit --severity moderate --all --recursive
