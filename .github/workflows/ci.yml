# Normal checks on every PR. Branch protection should require this to pass.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, free CLI)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source=/repo --redact --verbose
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with:
          node-version: 20
      - name: Install
        if: hashFiles('package.json') != ''
        run: corepack enable && yarn install --immutable
      - name: Lint
        if: hashFiles('package.json') != ''
        run: yarn lint
      - name: Type check
        if: hashFiles('package.json') != ''
        run: yarn typecheck
      - name: Tests
        if: hashFiles('package.json') != ''
        run: yarn test
      - name: Dependency audit
        if: hashFiles('package.json') != ''
        run: yarn npm audit --severity moderate --all --recursive
